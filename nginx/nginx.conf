events {}

http {
    resolver 127.0.0.11 valid=2s;

    upstream application {
        zone application 64k;
        server application:8080 resolve;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://application;
            # A replica that died keeps its IP in the upstream until the next DNS
            # refresh, and connect() to it only fails after tens of seconds. Fail
            # the connection fast and try another replica. Connection failures
            # happen before the request is sent, so this is safe for POST too;
            # requests already sent are never retried (non_idempotent is not set).
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 3;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
