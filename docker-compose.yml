services:
  postgres:
    image: postgres:16
    container_name: backend_challenge_postgres
    environment:
      POSTGRES_DB: betting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d betting"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: backend_challenge_localstack
    environment:
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SQS_TRANSACTION_QUEUE: ${SQS_TRANSACTION_QUEUE:-wager-transactions.fifo}
      SQS_TRANSACTION_DLQ: ${SQS_TRANSACTION_DLQ:-wager-transactions-dlq.fifo}
      SQS_EVENT_QUEUE: ${SQS_EVENT_QUEUE:-wager-events.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - "./localstack/init/ready.d:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name \"$${SQS_TRANSACTION_QUEUE:-wager-transactions.fifo}\" >/dev/null 2>&1 && awslocal sqs get-queue-url --queue-name \"$${SQS_TRANSACTION_DLQ:-wager-transactions-dlq.fifo}\" >/dev/null 2>&1 && awslocal sqs get-queue-url --queue-name \"$${SQS_EVENT_QUEUE:-wager-events.fifo}\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - "./keycloak:/opt/keycloak/data/import"
    healthcheck:
      # The realm endpoint answers only after the realm import finished.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/backend/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  application:
    build:
      context: .
    # Three independent processes by default (own memory, pools, consumers,
    # publisher and reference worker); override with --scale application=N.
    deploy:
      replicas: 3
    restart: unless-stopped
    # Longer than Fx's default 15 s stop timeout, so SIGTERM can drain the
    # in-flight work before Docker sends SIGKILL.
    stop_grace_period: 20s
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/betting?sslmode=disable
      HTTP_ADDR: :8080
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-http://localhost:8081/realms/backend}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/backend/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-backend-api}
      OIDC_PROVIDER_CLAIM: ${OIDC_PROVIDER_CLAIM:-provider_id}
      SQS_TRANSACTION_QUEUE: ${SQS_TRANSACTION_QUEUE:-wager-transactions.fifo}
      SQS_TRANSACTION_DLQ: ${SQS_TRANSACTION_DLQ:-wager-transactions-dlq.fifo}
      SQS_EVENT_QUEUE: ${SQS_EVENT_QUEUE:-wager-events.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      application:
        condition: service_started
    healthcheck:
      # End-to-end readiness through the proxy: some instance reaches PostgreSQL and SQS.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
